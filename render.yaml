# Render blueprint — deploys this repo as a web service.
# In the Render dashboard: New + > Blueprint > pick your GitHub repo.
services:
  - type: web
    name: praeva-template-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Recommended on ephemeral hosts: set the token as an env var (secret)
      # in the Render dashboard rather than saving it in the app UI, because the
      # filesystem resets on every deploy. Leave EZEKIA_USE_MOCK=0 to go live.
      - key: EZEKIA_TOKEN
        sync: false          # set the value in the dashboard; never committed
      - key: EZEKIA_USE_MOCK
        value: "0"
